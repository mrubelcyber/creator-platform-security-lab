name: Creator Platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit and API Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit/API tests
        run: python -m pytest tests/test_app.py tests/test_detect.py tests/test_ir_responder.py -v

      - name: ShellCheck scripts (warnings and errors fail the build)
        run: shellcheck -S warning scripts/*.sh

  sast:
    name: SAST - Semgrep (SARIF + fail on high)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_VERSION: "1.179.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep (pinned version)
        run: |
          python3 -m venv "$RUNNER_TEMP/sg"
          "$RUNNER_TEMP/sg/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
          "$RUNNER_TEMP/sg/bin/semgrep" --version
      - name: Scan once (SARIF + JSON, does not fail here)
        run: |
          "$RUNNER_TEMP/sg/bin/semgrep" scan --metrics=off \
            --config p/python --config p/owasp-top-ten --config p/security-audit \
            --sarif-output=semgrep.sarif --json-output=semgrep.json
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Gate - fail on ERROR/HIGH/CRITICAL
        run: |
          jq -r '.results[] | "\(.extra.severity)\t\(.check_id)\t\(.path):\(.start.line)"' semgrep.json
          blocking=$(jq '[.results[] | select(.extra.severity | IN("ERROR","HIGH","CRITICAL"))] | length' semgrep.json)
          echo "Blocking Semgrep findings: $blocking"
          test "$blocking" -eq 0

  secret-scan:
    permissions:
      contents: read
      security-events: write
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.28.0"
          GITLEAKS_SHA256="a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz

          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

          gitleaks version

      - name: Scan Git history for secrets
        run: gitleaks git . --config .gitleaks.toml --redact -v --report-format sarif --report-path gitleaks.sarif

      - name: Upload Gitleaks SARIF (redacted) to code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  container-scan:
    permissions:
      contents: read
      security-events: write
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        run: docker build --pull -t creator-platform:ci .

      - name: Install Trivy (pinned version, checksum verified)
        run: |
          TRIVY_VERSION="0.74.0"
          TRIVY_SHA256="2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Scan container for fixable HIGH/CRITICAL vulnerabilities
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            creator-platform:ci

      - name: Scan repo - dependencies + Dockerfile (gate on fixable HIGH/CRITICAL)
        run: trivy fs --scanners vuln,misconfig --misconfig-scanners dockerfile --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - name: Image report for code scanning (fixable MEDIUM+, SARIF)
        if: always()
        run: trivy image --scanners vuln --severity MEDIUM,HIGH,CRITICAL --ignore-unfixed --format sarif --output trivy-image.sarif creator-platform:ci
      - name: Upload Trivy SARIF to code scanning
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: SBOM of the built image (CycloneDX)
        if: always()
        run: trivy image --format cyclonedx --output sbom-image.cdx.json creator-platform:ci
      - name: Keep the SBOM as a build artifact
        if: always() && hashFiles('sbom-image.cdx.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image-cyclonedx
          path: sbom-image.cdx.json
          retention-days: 30

  iac-scan:
    permissions:
      contents: read
      security-events: write
    name: Checkov Terraform IaC Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov==3.3.19
          checkov --version

      - name: Scan Terraform with Checkov
        run: |
          checkov \
            -d terraform \
            --framework terraform \
            --quiet \
            --soft-fail-on LOW,MEDIUM \
            -o cli -o sarif \
            --output-file-path console,checkov.sarif

      - name: Drop accepted skips (in-source suppressions) from the SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        run: |
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' checkov.sarif > checkov-open.sarif
          echo "open: $(jq '[.runs[].results[]] | length' checkov-open.sarif)  accepted skips dropped: $(jq '[.runs[].results[] | select(.suppressions)] | length' checkov.sarif)"
      - name: Upload Checkov SARIF to code scanning
        if: always() && hashFiles('checkov-open.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: checkov-open.sarif
          category: checkov

  dast-scan:
    name: OWASP ZAP Baseline + API Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: API inventory - spec must match every Flask route
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          python3 scripts/check_openapi_routes.py

      - name: Build and start the application container
        run: |
          docker build --pull -t creator-platform:zap .
          docker run -d --name creator-platform-zap -p 5000:5000 creator-platform:zap
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5000/health

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          cp .zap/rules.tsv zap-reports/rules.tsv
          docker run --rm --network host \
            -v "$(pwd)/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py -t http://127.0.0.1:5000 -c rules.tsv \
            -r zap-baseline.html -J zap-baseline.json

      - name: Run OWASP ZAP API scan (active, from .zap/openapi.yaml)
        if: always()
        run: |
          mkdir -p zap-reports && chmod 777 zap-reports
          cp .zap/openapi.yaml .zap/api-rules.tsv zap-reports/
          docker run --rm --network host \
            -v "$(pwd)/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi -O http://127.0.0.1:5000 -c api-rules.tsv \
            -r zap-api.html -J zap-api.json

      - name: Keep ZAP reports as a build artifact
        if: always() && hashFiles('zap-reports/*.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reports
          path: |
            zap-reports/*.html
            zap-reports/*.json
          retention-days: 30

      - name: Show application logs if the scan fails
        if: failure()
        run: docker logs creator-platform-zap

  iam-check:
    name: IAM least-privilege check (OIDC, no stored keys)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # lets the job request a GitHub OIDC token
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get short-lived AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          mask-aws-account-id: true
          role-session-name: gh-${{ github.run_id }}
          aws-region: us-east-1

      - name: Who am I
        run: aws sts get-caller-identity --query Arn --output text

      - name: Verify app role least privilege
        run: bash scripts/check_app_role.sh

  network-check:
    name: Terraform check (fmt + lock + validate)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TF_VERSION: "1.16.5"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform (pinned version, checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS"
          grep "terraform_${TF_VERSION}_linux_amd64.zip" "terraform_${TF_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "terraform_${TF_VERSION}_linux_amd64.zip"
          sudo mv terraform /usr/local/bin/terraform
          terraform -version

      - name: Format check
        run: terraform -chdir=terraform/network fmt -check -diff

      - name: Init (no backend, provider must match lock file)
        run: terraform -chdir=terraform/network init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform -chdir=terraform/network validate

      - name: Data protection - format check
        run: terraform -chdir=terraform/data-protection fmt -check -diff

      - name: Data protection - init (no backend, provider must match lock file)
        run: terraform -chdir=terraform/data-protection init -backend=false -input=false -lockfile=readonly

      - name: Data protection - validate
        run: terraform -chdir=terraform/data-protection validate

      - name: Monitoring - format check
        run: terraform -chdir=terraform/monitoring fmt -check -diff

      - name: Monitoring - init (no backend, provider must match lock file)
        run: terraform -chdir=terraform/monitoring init -backend=false -input=false -lockfile=readonly

      - name: Monitoring - validate
        run: terraform -chdir=terraform/monitoring validate

      - name: Incident response - format check
        run: terraform -chdir=terraform/incident-response fmt -check -diff

      - name: Incident response - init (no backend, provider must match lock file)
        run: terraform -chdir=terraform/incident-response init -backend=false -input=false -lockfile=readonly

      - name: Incident response - validate
        run: terraform -chdir=terraform/incident-response validate

      - name: CSPM - format check
        run: terraform -chdir=terraform/cspm fmt -check -diff

      - name: CSPM - init (no backend, provider must match lock file)
        run: terraform -chdir=terraform/cspm init -backend=false -input=false -lockfile=readonly

      - name: CSPM - validate
        run: terraform -chdir=terraform/cspm validate

      - name: Posture - format check
        run: terraform -chdir=terraform/posture fmt -check -diff

      - name: Posture - init (no backend, provider must match lock file)
        run: terraform -chdir=terraform/posture init -backend=false -input=false -lockfile=readonly

      - name: Posture - validate
        run: terraform -chdir=terraform/posture validate

      - name: Baseline - format check
        run: terraform -chdir=terraform/baseline fmt -check -diff

      - name: Baseline - init (no backend, provider must match lock file)
        run: terraform -chdir=terraform/baseline init -backend=false -input=false -lockfile=readonly

      - name: Baseline - validate
        run: terraform -chdir=terraform/baseline validate
