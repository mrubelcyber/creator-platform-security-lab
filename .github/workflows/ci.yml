name: Creator Platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit and API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit/API tests
        run: python -m pytest tests/test_app.py tests/test_detect.py -v

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.28.0"

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

          gitleaks version

      - name: Scan Git history for secrets
        run: gitleaks git . --config .gitleaks.toml -v

  container-scan:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build container image
        run: docker build --pull -t creator-platform:ci .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          trivy --version

      - name: Scan container for fixable HIGH/CRITICAL vulnerabilities
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            creator-platform:ci

  iac-scan:
    name: Checkov Terraform IaC Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov==3.3.19
          checkov --version

      - name: Scan Terraform with Checkov
        run: |
          checkov \
            -d terraform \
            --framework terraform \
            --quiet \
            --soft-fail-on LOW,MEDIUM

  dast-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and start the application container
        run: |
          docker build --pull -t creator-platform:zap .
          docker run -d --name creator-platform-zap -p 5000:5000 creator-platform:zap
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5000/health

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          cp .zap/rules.tsv zap-reports/rules.tsv
          docker run --rm --network host \
            -v "$(pwd)/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py -t http://127.0.0.1:5000 -c rules.tsv \
            -r zap-baseline.html -J zap-baseline.json

      - name: Show application logs if the scan fails
        if: failure()
        run: docker logs creator-platform-zap

  iam-check:
    name: IAM least-privilege check (OIDC, no stored keys)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # lets the job request a GitHub OIDC token
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Get short-lived AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::998493219212:role/creator-platform-ci
          role-session-name: gh-${{ github.run_id }}
          aws-region: us-east-1

      - name: Who am I
        run: aws sts get-caller-identity --query Arn --output text

      - name: Verify app role least privilege
        run: bash scripts/check_app_role.sh

  network-check:
    name: Network Terraform check (fmt + lock + validate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TF_VERSION: "1.16.5"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Terraform (pinned version, checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS"
          grep "terraform_${TF_VERSION}_linux_amd64.zip" "terraform_${TF_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "terraform_${TF_VERSION}_linux_amd64.zip"
          sudo mv terraform /usr/local/bin/terraform
          terraform -version

      - name: Format check
        run: terraform -chdir=terraform/network fmt -check -diff

      - name: Init (no backend, provider must match lock file)
        run: terraform -chdir=terraform/network init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform -chdir=terraform/network validate
